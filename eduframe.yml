# Personnalisation des paramètres de votre projet Edu Framework
# Ces paramètres sont affichés dans la console bin/edu et dans la barre de debug.
# Ce fichier est optionnel : s'il est absent, les valeurs par défaut du framework sont conservées.
# Attention : les valeurs doivent être quotées (des chaines de caractères)
#     php_version: 8.4      # ❌ interprété comme le nombre décimal 8.4 -> erreur
#     php_version: '8.4'    # ✓ interprété comme la chaine de caractères "8.4"

# Le nom de votre projet
name: 'EduFramework'

# La version de votre projet
version: 'v0.1.0@stable'

# La date de livraison de la version
date_version: '2026-10-08'

# La version minimale de PHP requise
php_version: '8.4'
